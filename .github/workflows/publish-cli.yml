# Publishes the public CLI/MCP package to npm, the MCP Registry, and GitHub Releases.
# npm's trusted publisher must match this repository and this workflow filename.
name: Publish CLI and MCP metadata

on:
  push:
    branches: [main]
    paths: [package.json]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check version against npm
        id: gate
        run: |
          local_v=$(node -p "require('./package.json').version")
          published_v=$(npm view identityforge version 2>/dev/null || echo "0.0.0")
          echo "local=$local_v published=$published_v"
          if [ "$local_v" = "$published_v" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "$published_v" "$local_v" | sort -V | tail -1)" = "$local_v" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Repo version $local_v is BEHIND npm $published_v" >&2
            exit 1
          fi
      - if: steps.gate.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - if: steps.gate.outputs.publish == 'true'
        run: npm test
      - if: steps.gate.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.gate.outputs.publish == 'true'
        run: npm run build
      - if: steps.gate.outputs.publish == 'true'
        id: pack
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.publish == 'true'
        name: Smoke-test packed MCP server
        run: |
          smoke_dir="$RUNNER_TEMP/identityforge-smoke"
          tarball="$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
          npm install --prefix "$smoke_dir" "$tarball" --ignore-scripts --no-audit --no-fund
          version=$(node -p "require('./package.json').version")
          test "$(node "$smoke_dir/node_modules/identityforge/dist/index.js" --version)" = "$version"
          node -e 'const p=require(process.argv[1]+"/node_modules/identityforge/package.json"); if(p.version!==process.argv[2]||p.mcpName!=="io.identityforge/mcp"||p.repository?.url!=="git+https://github.com/KasayoDotCom/identityforge-mcp.git") process.exit(1)' "$smoke_dir" "$version"
          update_status=$(node "$smoke_dir/node_modules/identityforge/dist/index.js" update-check)
          node -e 'const s=JSON.parse(process.argv[1]); if(s.currentVersion!==process.argv[2]||typeof s.updateAvailable!=="boolean"||!["registry","cache","unavailable"].includes(s.source)) process.exit(1)' "$update_status" "$version"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1.0.0"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | env -u IDENTITYFORGE_API_KEY node "$smoke_dir/node_modules/identityforge/dist/index.js" mcp > "$RUNNER_TEMP/mcp.jsonl"
          node -e 'const fs=require("node:fs"),r=fs.readFileSync(process.argv[1],"utf8").trim().split("\n").map(JSON.parse); if(r.find(x=>x.id===1)?.result?.serverInfo?.version!==process.argv[2]||!r.find(x=>x.id===2)?.result?.tools?.length) process.exit(1)' "$RUNNER_TEMP/mcp.jsonl" "$version"
      - if: steps.gate.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"
      - name: Check version against MCP Registry
        id: registry-gate
        run: |
          version=$(node -p "require('./package.json').version")
          registry_http_status=$(curl --ipv4 --silent --show-error \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/mcp-registry.json" --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.identityforge%2Fmcp/versions/$version")
          case "$registry_http_status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "MCP Registry returned HTTP $registry_http_status" >&2; exit 1 ;;
          esac
      - if: steps.registry-gate.outputs.publish == 'true'
        name: Install mcp-publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            > "$archive"
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - if: steps.registry-gate.outputs.publish == 'true'
        name: Publish to MCP Registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          test -n "$MCP_REGISTRY_PRIVATE_KEY"
          "$RUNNER_TEMP/mcp-publisher" login dns \
            --domain identityforge.io \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          "$RUNNER_TEMP/mcp-publisher" validate server.json
          "$RUNNER_TEMP/mcp-publisher" publish server.json
      - name: Publish matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Identity Forge CLI and MCP $tag" --generate-notes
